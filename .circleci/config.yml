version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/repo

jobs:
  build:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Build project
          command: npm run build
      - persist_to_workspace:
          root: ~/repo
          paths:
            - dist
            - package.json
            - package-lock.json
            - docker-compose.yml

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: ~/repo
      - add_ssh_keys
      - run:
          name: Deploy to VPS
          command: |
            ssh -o StrictHostKeyChecking=no deploy@${SERVER_IP} "mkdir -p /opt/streaming-api"
            cd ~/repo
            tar czf deploy.tar.gz dist package.json package-lock.json docker-compose.yml
            scp -o StrictHostKeyChecking=no deploy.tar.gz deploy@${SERVER_IP}:/opt/streaming-api/
            ssh -o StrictHostKeyChecking=no deploy@${SERVER_IP} "
              cd /opt/streaming-api
              tar xzf deploy.tar.gz
              rm deploy.tar.gz
              npm ci --omit=dev
              docker compose up -d redis
              pm2 restart streaming-api || pm2 start dist/src/index.js --name streaming-api
            "

workflows:
  build_and_deploy:
    jobs:
      - build:
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main
